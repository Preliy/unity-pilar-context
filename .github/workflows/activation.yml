# Produces the manual activation file for a Unity Personal licence, which is the first half of
# obtaining the UNITY_LICENSE secret the test matrix needs.
#
#   1. Run this workflow and download the 'unity-activation-file' artifact.
#   2. Upload the .alf at https://license.unity3d.com/manual and download the .ulf it returns.
#   3. Store the *entire contents* of the .ulf as the UNITY_LICENSE secret, alongside
#      UNITY_EMAIL and UNITY_PASSWORD.
#
# The file has to be generated on a runner rather than a workstation: the licence Unity returns is
# bound to the environment that requested it. Kept rather than deleted after the first activation
# because a Personal licence has to be renewed periodically.
name: Acquire Unity activation file

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: activation
        with:
          # Must match the unityVersion used by the test matrix in test.yml.
          unityVersion: 6000.3.18f1

      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.activation.outputs.filePath }}
