name: Test

on:
  pull_request:
    branches: [master]
  # release.yml calls this workflow and gates the release on it, which is also why there is no push
  # trigger for master: it would run the Unity matrix a second time for every release.
  workflow_call:
  workflow_dispatch:

# No paths filter on purpose: this repository IS the package, so almost every change is relevant,
# and a filtered-out run leaves a required status check pending forever.

# Literal 'test-' rather than github.workflow: under workflow_call that expands to the *caller's*
# name, so a shared group could have this workflow cancel the release run that is waiting on it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs without a Unity license, so pull requests from forks still get real signal.
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: package.json is well formed
        run: |
          jq empty package.json
          # UPM ids may not contain uppercase, which is why the id stays lowercase while the
          # display name, namespaces and assemblies are all PILAR.
          test "$(jq -r .name package.json)" = "com.pilar.context"
          jq -e '.name | test("^[a-z0-9][a-z0-9._-]*$")' package.json > /dev/null
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+")' package.json > /dev/null
          jq -e '.displayName and .description and .unity and .author and .license' package.json > /dev/null
          # Open Commissioning is an optional, documented prerequisite. It is not on any registry,
          # so declaring it as a UPM dependency would break installs outright.
          jq -e 'has("dependencies") | not' package.json > /dev/null

      - name: Assembly definitions are well formed and named PILAR
        run: |
          st=0
          for f in $(git ls-files '*.asmdef'); do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; st=1; }
            case "$(basename "$f")" in
              PILAR.*) ;;
              *) echo "::error file=$f::assembly definition should be named PILAR.*"; st=1 ;;
            esac
            jq -e '.name | startswith("PILAR.")' "$f" > /dev/null \
              || { echo "::error file=$f::assembly name should start with PILAR."; st=1; }
          done
          exit $st

      # CHANGELOG.md is exempt because semantic-release writes it from commit subjects, which this
      # check has no business failing on.
      - name: No stale Pilar casing anywhere
        run: |
          if git grep -n 'Pilar' -- '*.cs' '*.asmdef' '*.json' '*.md' ':!CHANGELOG.md'; then
            echo "::error::found 'Pilar' - the public surface is PILAR (the lowercase package id is separate)"
            exit 1
          fi

      - name: Optional dependencies stay guarded
        run: |
          st=0
          check() {
            local file="$1" define="$2" package="$3"
            jq -e --arg d "$define" '.defineConstraints | index($d)' "$file" > /dev/null \
              || { echo "::error file=$file::missing defineConstraint $define"; st=1; }
            # The expression must be empty: under semver 0.4.0-exp.1 < 0.4.0, so a release-version
            # expression would never match the pre-release actually in use.
            jq -e --arg p "$package" --arg d "$define" \
              '.versionDefines[] | select(.name == $p and .define == $d and .expression == "")' \
              "$file" > /dev/null \
              || { echo "::error file=$file::missing versionDefine for $package with an empty expression"; st=1; }
          }
          check Editor/OpenCommissioning/PILAR.Context.OpenCommissioning.asmdef PILAR_OC com.open-commissioning.core
          check Editor/Pipeline/PILAR.Context.Pipeline.asmdef PILAR_UNITY_PIPELINE com.unity.pipeline
          # The core assemblies must never reference a twin framework directly.
          for f in Runtime/PILAR.Context.asmdef Editor/PILAR.Context.Editor.asmdef; do
            jq -e '.references | index("OC") | not' "$f" > /dev/null \
              || { echo "::error file=$f::core assemblies must not reference OC"; st=1; }
          done
          exit $st

      # The highest-value check here: consumer scenes resolve ContextNode by this GUID.
      # Regenerate the .meta and every serialized reference breaks silently.
      - name: Meta file integrity
        run: |
          st=0
          # Everything Unity imports needs a .meta. Unity ignores dot-prefixed paths and any folder
          # ending in '~', so Documentation~/, TestProject~/, .github/ and dotfiles are exempt.
          for f in $(git ls-files); do
            case "$f" in
              .*|*/.*) continue ;;
              *~/*) continue ;;
              *.meta) continue ;;
            esac
            [ -f "$f.meta" ] || { echo "::error file=$f::missing $f.meta"; st=1; }
          done
          for m in $(git ls-files | grep '\.meta$'); do
            [ -e "${m%.meta}" ] || { echo "::error file=$m::orphaned .meta"; st=1; }
          done
          grep -q 'guid: c5236d538fb060b48834286d70f34fa6' Runtime/ContextNode.cs.meta \
            || { echo "::error::ContextNode GUID changed - this silently breaks every consumer scene"; st=1; }
          exit $st

      - name: Documentation is present and hidden from Unity
        run: |
          for f in README.md CHANGELOG.md LICENSE.md 'Documentation~/HowToUse.md'; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          # A Documentation folder without the tilde would be imported as assets.
          test ! -d Documentation || { echo "::error::Documentation/ must be Documentation~/"; exit 1; }
          # An untilded test project would compile inside every consumer's project, because a UPM
          # git install copies the whole repository into PackageCache.
          test ! -d TestProject || { echo "::error::TestProject/ must be TestProject~/"; exit 1; }
          # release.yml hides this folder with `git mv Tests Tests~` when it builds the upm branch.
          # Renaming it here would make that a silent no-op and ship the tests to consumers.
          test -d Tests || { echo "::error::Tests/ is missing - release.yml expects to hide it"; exit 1; }

      # The version is written by semantic-release, so it is never edited by hand and never needs to
      # be checked against a tag. What does need checking is that the README does not pin a version:
      # the bump lands in package.json only, so a pinned install URL would silently go stale.
      - name: README tracks the upm branch without pinning a version
        run: |
          grep -q '#upm"' README.md \
            || { echo "::error::README install snippet should use the unpinned #upm ref"; exit 1; }
          if grep -nE 'unity-pilar-context\.git#(v|upm/v)[0-9]' README.md; then
            echo "::error::README pins a version that package.json's bump will not update"
            exit 1
          fi

  # A Unity Personal activation expires, and there is only one of it. Without this gate an expired
  # licence would block every release behind a failure that has nothing to do with the code. The
  # secrets context is unavailable in a job-level `if`, hence a job whose output can be tested.
  licence:
    name: Unity licence available
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE is not set - skipping the EditMode matrix. See the README section on renewing the CI Unity licence."
          fi

  test:
    name: EditMode (${{ matrix.leg }})
    runs-on: ubuntu-latest
    needs: [validate, licence]
    # This also covers fork pull requests: they cannot read secrets, so the licence reads as absent
    # and the matrix skips rather than failing red.
    if: needs.licence.outputs.available == 'true'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-dependency legs rather than one combined "minimal" leg: when a guard regresses, the
          # leg name says which one instead of producing an undifferentiated wall of CS0246.
          - leg: full
            remove: ''
          - leg: no-oc
            remove: com.open-commissioning.core
          - leg: no-pipeline
            remove: com.unity.pipeline
    steps:
      - uses: actions/checkout@v4

      # Copy the hidden host project to a plain name. The tilde is required so the project is never
      # imported into a consumer's project, and Unity itself opens a tilde'd project fine (verified
      # locally) -- but this action passes the path through its own shell and Docker volume handling,
      # which is not something to discover on a red build. One cp removes the question.
      - name: Stage the host project
        run: cp -r 'TestProject~' ci-project

      - name: Remove ${{ matrix.remove }} to exercise the assembly guard
        if: matrix.remove != ''
        run: |
          for f in ci-project/Packages/manifest.json ci-project/Packages/packages-lock.json; do
            jq --arg p '${{ matrix.remove }}' 'del(.dependencies[$p])' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      # The package is referenced as file:../../ from TestProject~/Packages; from ci-project/Packages
      # that same relative path still resolves to the repository root.
      - uses: actions/cache@v4
        with:
          path: ci-project/Library
          key: Library-${{ matrix.leg }}-${{ hashFiles('TestProject~/Packages/*.json', 'Runtime/**', 'Editor/**', 'Tests/**') }}
          restore-keys: |
            Library-${{ matrix.leg }}-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Three dependencies resolve over git; fail fast instead of blocking on a credential prompt.
          GIT_TERMINAL_PROMPT: '0'
        with:
          projectPath: ci-project
          unityVersion: 6000.3.18f1
          testMode: EditMode
          artifactsPath: artifacts
          checkName: EditMode (${{ matrix.leg }})
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.leg }}
          path: ${{ steps.tests.outputs.artifactsPath }}
