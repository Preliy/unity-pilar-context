name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  PACKAGE_NAME: pilar-context
  DEFAULT_BRANCH: master
  GIT_USER_NAME: github-actions[bot]
  GIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

# Never cancel a release in flight: it pushes a branch, two tags and a GitHub release, and half of
# that is worse than none of it.
concurrency:
  group: release
  cancel-in-progress: false

# The called workflow cannot be granted more than the caller, and game-ci/unity-test-runner needs
# checks: write to publish its check run.
permissions:
  contents: write
  checks: write

jobs:
  # Gate the release on the same matrix pull requests get: validate, then EditMode with and without
  # each optional dependency.
  test:
    # semantic-release's own release commit carries [skip ci], which GitHub honours for the workflow
    # as a whole. Guarded here as well because an App-token push is an ordinary push that does
    # retrigger workflows, unlike a GITHUB_TOKEN one.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-package:
    name: Release and rebuild upm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A GitHub App token rather than GITHUB_TOKEN: the master ruleset requires a pull request, and
      # only an App (or admin) can be put on a ruleset bypass list. The App must have
      # Contents: read and write, and be installed on this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-release reads the whole history to work out the next version.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Bumps package.json, prepends to CHANGELOG.md, commits both back to master, and pushes the
      # vX.Y.Z tag. @semantic-release/npm runs with npmPublish: false - it is here for the version
      # bump only, nothing is published to npm.
      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Recreate the upm (release) branch for the latest version. Because @semantic-release/git has
      # already committed the bump to master, upm inherits the released package.json and CHANGELOG.
      - name: Create UPM branch
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          git config --global user.name  "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"
          git checkout "$DEFAULT_BRANCH"
          git checkout -B upm

      # Hide the folders Unity would otherwise compile in a consumer's project. A UPM git install
      # copies the whole repository into PackageCache and imports everything not hidden by a
      # trailing '~'. Samples/ and Documentation/ are already absent or already tilde'd here; the
      # steps stay so the template still works if either is ever added back untilded.
      - name: Hide Samples, Documentation and Tests from Unity
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          for d in Samples Documentation Tests; do
            if [ -d "$d" ]; then
              echo "Hiding $d/ as $d~/"
              git mv "$d" "$d~"
              rm -f "$d.meta"
            fi
          done

      # .gitattributes is deliberately kept: it holds the eol=lf normalisation that keeps .meta
      # files byte-stable for anyone who clones the upm branch on Windows.
      - name: Remove development-only files
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          rm -f .releaserc.json .gitignore
          rm -rf .github 'TestProject~'

      - name: Push UPM branch
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          git commit -am "Release v${{ steps.semantic.outputs.new_release_version }}"
          git push -f -u origin upm

      - name: Tag UPM branch
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          version="${{ steps.semantic.outputs.new_release_version }}"
          git tag -f "upm/v$version" upm
          git push -f origin "refs/tags/upm/v$version"

      # git archive rather than moving the working tree into a package/ folder: it takes the tree
      # straight from the upm ref, so .git can never end up inside the tarball, and package/ is the
      # prefix UPM expects when installing a tarball from disk.
      - name: Create package tarball
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          version="${{ steps.semantic.outputs.new_release_version }}"
          git archive --format=tar.gz --prefix=package/ \
            -o "$PACKAGE_NAME-$version.tar.gz" upm
          tar -tzf "$PACKAGE_NAME-$version.tar.gz" | head -20

      # The release is cut against upm/vX.Y.Z, not vX.Y.Z, so the page points at the ref that is
      # actually installable. Notes go through a file so their contents can never be interpreted by
      # the shell.
      - name: Publish GitHub release
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
          NOTES: ${{ steps.semantic.outputs.new_release_notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "upm/v$VERSION" \
            --title "Release $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$PACKAGE_NAME-$VERSION.tar.gz"
